<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Panel de Reparaciones</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="sin-sesion">
  <div id="demo" class="demo" hidden></div>

  <header class="top">
    <div class="marca">
      <span class="logo">🔧</span>
      <div>
        <h1 id="app-nombre">Panel de Reparaciones</h1>
        <small>Estado de equipos en reparación</small>
      </div>
    </div>
    <div id="usuario" class="usuario"></div>
  </header>

  <nav id="tabs" class="tabs">
    <button data-act="tab" data-view="panel"><span>📊</span>Panel</button>
    <button data-act="tab" data-view="pila"><span>📋</span>Pila</button>
    <button data-act="tab" data-view="equipos"><span>🔎</span>Equipos</button>
    <button data-act="tab" data-view="ajustes" id="tab-ajustes" hidden><span>⚙️</span>Ajustes</button>
  </nav>

  <main id="main"><p class="cargando">Cargando…</p></main>

  <button id="fab" class="fab" data-act="nuevo" title="Cargar equipo" hidden>＋<span>Nuevo equipo</span></button>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
